<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/ass7.css">
</head>

<body>
    <div class="bodyfull">
        <div class="box">
            Calculator
            <div class="numbers">
                <input type="text" id="inscreen" readonly 
                       style="width:350px;height:40px;font-size:30px;">
                <div class="nos">
                    <div class="row1">
                        <button onclick="calc('1')">1</button>
                        <button onclick="calc('2')">2</button>
                        <button onclick="calc('3')">3</button>
                        <button onclick="calc('+')">+</button>
                        <button onclick="calc('**')">^</button><br>
                    </div>
                    <div class="row2">
                        <button onclick="calc('4')">4</button>
                        <button onclick="calc('5')">5</button>
                        <button onclick="calc('6')">6</button>
                        <button onclick="calc('-')">-</button>
                        <button onclick="sqrt()">√</button><br>
                    </div>
                    <div class="row3">
                        <button onclick="calc('7')">7</button>
                        <button onclick="calc('8')">8</button>
                        <button onclick="calc('9')">9</button>
                        <button onclick="calc('*')">*</button>
                        <button onclick="square()">x²</button><br>
                    </div>
                    <div class="row4">
                        <button onclick="calc('0')">0</button>
                        <button onclick="calc('00')">00</button>
                        <button onclick="calc('.')">.</button>
                        <button onclick="calc('/')">/</button><br>
                    </div>
                    <div class="row5">
                        <button onclick="clearsp('C')">C</button>
                        <button onclick="backspace()">⌫</button>
                        <button onclick="result()">=</button><br>
                    </div>
                </div>


            </div>
        </div>       
    </div>
</body>
<script src="./js/ass7.js"></script>
</html>
