{% load static %}
<head>
    <title>USER LOGIN PRODUCTS combined</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand  fw-bold" href="#">HI-LITE Shopping Mart</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'products'%}">Home</a>
                        </li>
                        {% if user.is_authenticated %}
                            <li class="nav-item">
                            <a class="nav-link" href="{% url 'profiles'%}">Profiles</a>
                            </li>
                            <div class="nav-right">
                                <li class="nav-item">
                                <a class="nav-link" href="{% url 'logout'%}">Logout➡️</a>
                                </li>
                                <li class="nav-item">
                                <a class="nav-link" href="">{{request.user}}</a>
                                </li>
                            </div>
                        {% else %}
                            <div class="nav-right">
                            <li class="nav-item">
                            <a class="nav-link" href="{% url 'register'%}">Register</a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link" href="{% url 'login'%}">Login⬅️</a>
                            </li>
                            </div>
                        {%endif%}
                        
                    </ul>

                    </div>
                </div>
        </nav>

    </header>
    <div class="main">
            {% block content%}
            {% endblock %}

    </div>
<footer class="bg-dark text-white text-center p-3">
    Hi-Lite Shopping Mart
</footer>  
</body>
</html>
